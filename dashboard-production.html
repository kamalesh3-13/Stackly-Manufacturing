<script>
(function(){
  // ---- Logged-in identity: show only the real signed-in name/email, never a placeholder person ----
  var email = localStorage.getItem('stackly_user_email');
  var displayName = email || 'Guest';
  var initials = email ? email.slice(0,2).toUpperCase() : 'G';
  var topbarName = document.getElementById('topbarName');
  var topbarAvatar = document.getElementById('topbarAvatar');
  var sidebarName = document.getElementById('sidebarUserName');
  var sidebarAvatar = document.getElementById('sidebarAvatar');
  if(topbarName) topbarName.textContent = displayName;
  if(topbarAvatar) topbarAvatar.textContent = initials;
  if(sidebarName) sidebarName.textContent = displayName;
  if(sidebarAvatar) sidebarAvatar.textContent = initials;

  // ---- Logo stays on the dashboard while signed in: reload in place, never leave to the main site ----
  var logo = document.getElementById('sidebarLogo');
  if(logo){
    logo.addEventListener('click', function(e){
      e.preventDefault();
      window.location.reload();
    });
  }

  // ---- Logout is the only action that sends the visitor back to the main site ----
  // Wired to every logout control (topbar + sidebar/mobile drawer), not just one.
  var logoutBtns = document.querySelectorAll('.js-logout');
  logoutBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      logoutBtns.forEach(function(b){
        b.classList.add('logging-out');
        var lbl = b.querySelector('span');
        if(lbl) lbl.textContent = 'Logging out…';
      });
      try{ localStorage.removeItem('stackly_user_email'); }catch(err){}
      setTimeout(function(){ window.location.assign('index.html'); }, 500);
    });
  });
})();
</script>
